name: Build Droidspaces GKI kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: droidspaces-gki-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 GKI 5.10.260
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang-14 flex gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi git libelf-dev libncurses-dev libssl-dev \
            lld-14 llvm-14 lz4 python3 rsync zstd
          # Linux 5.10 Kconfig probes the unsuffixed linker name.
          sudo ln -sf "$(command -v ld.lld-14)" /usr/local/bin/ld.lld
          ld.lld --version

      - name: Fetch the requested kernel source branch
        run: |
          git clone --depth 1 --branch upstream-test \
            https://github.com/V1NAY007/android_kernel_oplus_mt6895.git kernel
          git -C kernel rev-parse HEAD | tee kernel-source-commit.txt

      - name: Fetch required Oplus CPU Kconfig sources
        env:
          MODULES_COMMIT: 90e5b2b12ec5767f9119d702979c7e5eeec6db53
        run: |
          # The modules repository is large; fetch only the exact Oplus CPU subtree
          # from the upstream-test branch commit instead of cloning the whole repository.
          curl -fsSL \
            "https://api.github.com/repos/V1NAY007/android_kernel_modules_oplus_mt6895/git/trees/$MODULES_COMMIT?recursive=1" \
            -o "$RUNNER_TEMP/modules-tree.json"
          python3 - "$RUNNER_TEMP/modules-tree.json" "$RUNNER_TEMP/cpu-files.txt" <<'PY'
          import json, sys
          tree = json.load(open(sys.argv[1], encoding="utf-8"))
          if tree.get("truncated"):
              raise SystemExit("Git tree response was truncated")
          prefix = "vendor/oplus/kernel/cpu/"
          paths = [item["path"] for item in tree["tree"]
                   if item["type"] == "blob" and item["path"].startswith(prefix)]
          if not paths or not any(path.endswith("/sched/Kconfig") for path in paths):
              raise SystemExit("Oplus CPU subtree or sched/Kconfig is missing")
          with open(sys.argv[2], "w", encoding="utf-8") as out:
              out.write("\n".join(paths) + "\n")
          print(f"Fetching {len(paths)} Oplus CPU source files from {MODULES_COMMIT}")
          PY
          while IFS= read -r path; do
            mkdir -p "$GITHUB_WORKSPACE/$(dirname "$path")"
            curl -fsSL \
              "https://raw.githubusercontent.com/V1NAY007/android_kernel_modules_oplus_mt6895/$MODULES_COMMIT/$path" \
              -o "$GITHUB_WORKSPACE/$path"
          done < "$RUNNER_TEMP/cpu-files.txt"
          test -f "$GITHUB_WORKSPACE/vendor/oplus/kernel/cpu/sched/Kconfig"
          test -f "$GITHUB_WORKSPACE/kernel/kernel/oplus_cpu/sched/Kconfig"
          test "$(readlink -f "$GITHUB_WORKSPACE/kernel/kernel/oplus_cpu")" = "$GITHUB_WORKSPACE/vendor/oplus/kernel/cpu"
          echo "Oplus CPU Kconfig source tree is in place."

      - name: Apply and validate GKI kABI patches
        working-directory: kernel
        run: |
          patch --batch --forward --dry-run -p1 < ../patches/001-fix-sysvipc-kabi.patch
          patch --batch --forward -p1 < ../patches/001-fix-sysvipc-kabi.patch
          patch --batch --forward --dry-run -p1 < ../patches/002-posix-mqueue-kabi-5.10.patch
          patch --batch --forward -p1 < ../patches/002-posix-mqueue-kabi-5.10.patch

      - name: Configure Droidspaces requirements
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: -14
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
        run: |
          make O=out gki_defconfig
          for option in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS NETFILTER_XT_MATCH_ADDRTYPE; do
            scripts/config --file out/.config --enable "$option"
          done
          # These two options change GKI structure layouts and are intentionally excluded.
          scripts/config --file out/.config --disable CFS_BANDWIDTH --disable CGROUP_PIDS
          make O=out olddefconfig

          for option in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS NETFILTER_XT_MATCH_ADDRTYPE MODVERSIONS; do
            grep -qx "CONFIG_${option}=y" out/.config || {
              echo "Required config missing after olddefconfig: CONFIG_${option}"
              exit 1
            }
          done

          if grep -Eq '^CONFIG_(CFS_BANDWIDTH|CGROUP_PIDS)=y$' out/.config; then
            echo "Refusing to build with ABI-breaking cgroup options enabled"
            exit 1
          fi

      - name: Build compressed arm64 kernel image
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: -14
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: ubuntu-runner
        run: |
          make O=out -j2 Image.lz4
          mkdir -p ../artifacts
          cp out/arch/arm64/boot/Image.lz4 ../artifacts/
          cp out/.config ../artifacts/kernel.config
          cp out/System.map ../artifacts/
          cp ../kernel-source-commit.txt ../artifacts/
          {
            echo "Kernel source: V1NAY007/android_kernel_oplus_mt6895"
            echo "Source branch: upstream-test"
            echo "Architecture: arm64"
            echo "Kernel release: $(make O=out -s kernelrelease)"
            echo "Build commit: $GITHUB_SHA"
            echo "Enabled Droidspaces configs:"
            grep -E '^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|NETFILTER_XT_MATCH_ADDRTYPE|MODVERSIONS)=y$' out/.config
            echo "ABI-sensitive resource-limit configs:"
            grep -E '^CONFIG_(CFS_BANDWIDTH|CGROUP_PIDS)=y$' out/.config || true
          } > ../artifacts/build-info.txt

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-mt6895-gki-5.10.260
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
